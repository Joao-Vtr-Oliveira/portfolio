<section id="experiencia" class="w-full scroll-mt-20 px-4 py-10">
	<div class="mx-auto max-w-7xl">
		<h2 class="text-3xl font-bold text-center mb-10 text-blue-500">
			Experiência Profissional
		</h2>

		<div class="flex flex-col justify-center gap-8">
			@for (experience of experiences(); track experience.id) {

			<mat-card
				appearance="outlined"
				class="w-full max-w-5xl flex flex-col justify-between rounded-2xl shadow-lg hover:shadow-2xl transition-transform hover:scale-[1.01] bg-white dark:bg-gray-800"
			>
				<mat-card-header>
					<mat-card-title class="text-lg font-semibold">{{
						experience.role
					}}</mat-card-title>
					<mat-card-subtitle
						>{{ experience.company }} · {{ experience.period }}</mat-card-subtitle
					>
				</mat-card-header>

				<mat-card-content class="px-4 pb-4">
					<p
						class="whitespace-pre-line break-words text-sm text-gray-700 dark:text-gray-300"
					>
						{{ experience.bio }}
					</p>
				</mat-card-content>

				<div class="px-4 mt-2 mb-2">
					<img
						[src]="experience.tech"
						[alt]="experience.role + ' stack'"
						class="max-w-full h-8 object-contain"
						loading="lazy"
					/>
				</div>

				@if (experience.deployLink) {
				<mat-card-actions align="end" class="px-4 pb-4">
					<a
						class="customBtn"
						matFab
						extended
						[href]="experience.deployLink"
						target="_blank"
						rel="noopener noreferrer"
					>
						<mat-icon>link</mat-icon>
						Page
					</a>
				</mat-card-actions>
				}
			</mat-card>

			}
		</div>
	</div>
</section>
