<div id='home' class="w-full scroll-mt-20 max-w-2xl flex flex-col sm:flex-row items-center sm:items-start px-4">
	<img
		src="/images/jão.jpg"
		alt="João Vitor de Oliveira"
		class="rounded-4xl w-48 sm:w-[300px]"
	/>

  <div class="sm:ml-5 mt-5 text-center sm:text-left">
    <h1 class="text-3xl sm:text-4xl font-bold text-blue-500">{{ i18n.t('intro.hello') }}</h1>
    <h2 data-testid="heading2-introductionComponent" class="text-xl sm:text-2xl font-bold text-blue-500">
      João Vitor De Oliveira.
    </h2>
		<p class="mt-2 leading-relaxed">
			{{ i18n.t('intro.bio') }}
		</p>
		<p class="mt-3 leading-relaxed">
			{{ i18n.t('intro.forge') }}
			<a href="#projetos" (click)="scrollToProjects($event)" class="text-violet-300 underline underline-offset-4 focus-visible:outline-2 focus-visible:outline-offset-2">{{ i18n.t('intro.explore') }}</a>.
		</p>

		<a [href]="resumePath()" download>
      <button class="mt-5" matButton="filled">
		{{ i18n.t('intro.cv') }}
      </button>
    </a>
  </div>
</div>
