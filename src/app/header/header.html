<div class="progress" aria-hidden="true" [style.transform]="'scaleX(' + progress() + ')'"></div>

<header class="bar">
	<button type="button" class="brand" (click)="goTo('/' + i18n.locale())" [attr.aria-label]="'João Vitor De Oliveira — ' + i18n.t('nav.home')">
		<span class="brand__mark" aria-hidden="true">JV</span>
		<span class="brand__name" data-testid="spanName-headerComponent">João Vitor <span class="brand__last">De Oliveira</span></span>
	</button>

	<nav class="links" aria-label="Principal">
		<a class="links__home" (click)="scrollTo('home')" data-testid="anchorHome-headerComponent" [class.is-active]="active() === 'home'">{{ i18n.t('nav.home') }}</a>
		@for (item of nav; track item.id; let i = $index) {
			<a (click)="scrollTo(item.id)" [class.is-active]="active() === item.id"><span class="links__num">0{{ i + 1 }}</span>{{ i18n.t(item.key) }}</a>
		}
	</nav>

	<div class="tools">
		<div class="lang" role="group" aria-label="Language selector">
			<span class="lang__thumb" [class.is-en]="i18n.isEnglish()" aria-hidden="true"></span>
			<button type="button" [class.is-on]="i18n.locale() === 'pt-BR'" [attr.aria-pressed]="i18n.locale() === 'pt-BR'" (click)="switchLocale('pt-BR')">PT</button>
			<button type="button" [class.is-on]="i18n.locale() === 'en'" [attr.aria-pressed]="i18n.locale() === 'en'" (click)="switchLocale('en')">EN</button>
		</div>

		<a class="talk" (click)="scrollTo('contato')">
			<span class="dot" aria-hidden="true"></span>{{ i18n.t('nav.talk') }}
		</a>

		<button type="button" class="burger" [attr.aria-expanded]="menuOpen()" aria-controls="menu" [attr.aria-label]="menuOpen() ? i18n.t('nav.close') : i18n.t('nav.menu')" (click)="toggleMenu()">
			<span></span><span></span>
		</button>
	</div>
</header>

<div id="menu" class="menu" [attr.aria-hidden]="!menuOpen()" [attr.inert]="menuOpen() ? null : ''">
	<nav class="menu__links" aria-label="Menu">
		<a (click)="scrollTo('home')" style="--i: 0"><span>00</span>{{ i18n.t('nav.home') }}</a>
		@for (item of nav; track item.id; let i = $index) {
			<a (click)="scrollTo(item.id)" [style.--i]="i + 1"><span>0{{ i + 1 }}</span>{{ i18n.t(item.key) }}</a>
		}
	</nav>
	<div class="menu__foot">
		<a href="https://github.com/Joao-Vtr-Oliveira" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><app-icon name="github" class="h-6 w-6 fill-current" /> GitHub</a>
		<a href="https://www.linkedin.com/in/jo%C3%A3o-vitor-oliveira-b8b190252/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><app-icon name="linkedin" class="h-6 w-6 fill-current" /> LinkedIn</a>
	</div>
</div>
